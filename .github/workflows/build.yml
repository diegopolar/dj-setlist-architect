name: Build DJ Setlist APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Recrear carpeta Android y compilar APK
        run: |
          flutter create --platforms=android --project-name dj_setlist_architect .
          flutter pub get
          flutter build apk --release

      - name: Subir APK generado
        uses: actions/upload-artifact@v4
        with:
          name: dj-setlist-architect-apk
          path: build/app/outputs/flutter-apk/app-release.apk
